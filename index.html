<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Average Fc - Prototype</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none; /* Let clicks pass through to canvas if needed later */
        }
    </style>
</head>
<body>

    <div id="ui">
        <h2>Average Fc</h2>
        <p>Controls: WASD to Move | SPACE to Shoot/Pass</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Resize canvas to fill the browser window
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Game World Setup (Bigger than the screen)
        const pitchWidth = 2000;
        const pitchHeight = 1200;

        // Camera object to follow the player
        const camera = {
            x: 0,
            y: 0,
            width: canvas.width,
            height: canvas.height
        };

        // Input handling
        const keys = { w: false, a: false, s: false, d: false, space: false };
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = true;
            if (e.key === 'a' || e.key === 'A') keys.a = true;
            if (e.key === 's' || e.key === 'S') keys.s = true;
            if (e.key === 'd' || e.key === 'D') keys.d = true;
            if (e.key === ' ') keys.space = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = false;
            if (e.key === 'a' || e.key === 'A') keys.a = false;
            if (e.key === 's' || e.key === 'S') keys.s = false;
            if (e.key === 'd' || e.key === 'D') keys.d = false;
            if (e.key === ' ') keys.space = false;
        });

        // The Ball
        const ball = {
            x: pitchWidth / 2,
            y: pitchHeight / 2,
            radius: 8,
            color: 'white',
            vx: 0,
            vy: 0,
            friction: 0.96
        };

        // Players Array
        const players = [];

        // Player Class
        class Player {
            constructor(x, y, color, isControlled) {
                this.x = x;
                this.y = y;
                this.radius = 15;
                this.color = color;
                this.speed = 5;
                this.isControlled = isControlled;
                this.hasBall = false;
            }

            update() {
                if (this.isControlled) {
                    // Movement
                    if (keys.w) this.y -= this.speed;
                    if (keys.s) this.y += this.speed;
                    if (keys.a) this.x -= this.speed;
                    if (keys.d) this.x += this.speed;

                    // Keep player in bounds
                    this.x = Math.max(0, Math.min(pitchWidth, this.x));
                    this.y = Math.max(0, Math.min(pitchHeight, this.y));

                    // Dribbling logic (check collision with ball)
                    const dx = ball.x - this.x;
                    const dy = ball.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < this.radius + ball.radius + 5) {
                        this.hasBall = true;
                        // Snap ball to player
                        ball.x = this.x + (dx / distance) * (this.radius + ball.radius + 2);
                        ball.y = this.y + (dy / distance) * (this.radius + ball.radius + 2);
                        ball.vx = 0;
                        ball.vy = 0;

                        // Shoot mechanics
                        if (keys.space) {
                            // Kick the ball in the direction of movement, or forward if standing still
                            let kickX = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
                            let kickY = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
                            
                            if (kickX === 0 && kickY === 0) { kickX = 1; } // Default kick right
                            
                            ball.vx = kickX * 15;
                            ball.vy = kickY * 15;
                            this.hasBall = false;
                        }
                    } else {
                        this.hasBall = false;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Highlight active player
                if (this.isControlled) {
                    ctx.beginPath();
                    ctx.arc(this.x - camera.x, this.y - camera.y, this.radius + 6, 0, Math.PI * 2);
                    ctx.strokeStyle = 'yellow';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }
        }

        // Setup 4-3-3 Attacking Formation (Blue Team)
        // Strikers
        players.push(new Player(pitchWidth/2 + 200, pitchHeight/2 - 150, 'blue', false)); // LW
        players.push(new Player(pitchWidth/2 + 300, pitchHeight/2, 'blue', false));       // ST
        players.push(new Player(pitchWidth/2 + 200, pitchHeight/2 + 150, 'blue', false)); // RW
        
        // Midfielders
        players.push(new Player(pitchWidth/2, pitchHeight/2 - 100, 'blue', false));       // CAM/LCM
        players.push(new Player(pitchWidth/2, pitchHeight/2 + 100, 'blue', false));       // CAM/RCM
        players.push(new Player(pitchWidth/2 - 100, pitchHeight/2, 'blue', false));       // CDM
        
        // Defenders (Starting control as the Left Fullback)
        players.push(new Player(pitchWidth/2 - 300, pitchHeight/2 - 250, 'blue', true));  // LB (Active)
        players.push(new Player(pitchWidth/2 - 300, pitchHeight/2 - 80, 'blue', false));  // CB
        players.push(new Player(pitchWidth/2 - 300, pitchHeight/2 + 80, 'blue', false));  // CB
        players.push(new Player(pitchWidth/2 - 300, pitchHeight/2 + 250, 'blue', false)); // RB

        let activePlayer = players.find(p => p.isControlled);

        function update() {
            // Update ball physics
            ball.x += ball.vx;
            ball.y += ball.vy;
            ball.vx *= ball.friction;
            ball.vy *= ball.friction;

            // Ball boundaries
            if (ball.x - ball.radius < 0 || ball.x + ball.radius > pitchWidth) ball.vx *= -1;
            if (ball.y - ball.radius < 0 || ball.y + ball.radius > pitchHeight) ball.vy *= -1;

            // Update all players
            players.forEach(p => p.update());

            // Camera smoothly follows the active player
            const targetCamX = activePlayer.x - canvas.width / 2;
            const targetCamY = activePlayer.y - canvas.height / 2;
            
            // Smoothing formula for camera
            camera.x += (targetCamX - camera.x) * 0.1;
            camera.y += (targetCamY - camera.y) * 0.1;

            // Clamp camera to pitch boundaries
            camera.x = Math.max(0, Math.min(pitchWidth - canvas.width, camera.x));
            camera.y = Math.max(0, Math.min(pitchHeight - canvas.height, camera.y));
        }

        function drawPitch() {
            // Grass
            ctx.fillStyle = '#2e8b57';
            ctx.fillRect(-camera.x, -camera.y, pitchWidth, pitchHeight);

            // Lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 5;

            // Outer boundary
            ctx.strokeRect(-camera.x, -camera.y, pitchWidth, pitchHeight);

            // Center line
            ctx.beginPath();
            ctx.moveTo(pitchWidth / 2 - camera.x, -camera.y);
            ctx.lineTo(pitchWidth / 2 - camera.x, pitchHeight - camera.y);
            ctx.stroke();

            // Center circle
            ctx.beginPath();
            ctx.arc(pitchWidth / 2 - camera.x, pitchHeight / 2 - camera.y, 100, 0, Math.PI * 2);
            ctx.stroke();
        }

        function draw() {
            // Clear screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawPitch();

            // Draw ball
            ctx.beginPath();
            ctx.arc(ball.x - camera.x, ball.y - camera.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = ball.color;
            ctx.fill();

            // Draw players
            players.forEach(p => p.draw());
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Handle window resizing
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            camera.width = canvas.width;
            camera.height = canvas.height;
        });

        // Start the game
        gameLoop();
    </script>
</body>
</html>
